<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แอปตรวจสอบสีผ่านกล้อง</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        body { font-family: 'Tahoma', sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        #video-container { position: relative; display: inline-block; margin-top: 15px; }
        video { border: 4px solid #333; border-radius: 10px; width: 100%; max-width: 400px; cursor: crosshair; background: #000; }
        canvas { display: none; } /* ซ่อนไว้ใช้ประมวลผลภาพหลังบ้าน */
        .result-box { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; min-width: 300px; }
        #color-preview { width: 100px; height: 100px; border-radius: 50%; margin: 10px auto; border: 2px solid #ddd; background-color: #ffffff; }
        button { padding: 12px 24px; font-size: 16px; background: #2196F3; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #1976D2; }
    </style>
</head>
<body>
    <h1>🔍 ตรวจสอบสีผ่านกล้อง</h1>
    <p>กดปุ่มเปิดกล้อง (อนุญาตให้เว็บใช้กล้อง) แล้วคลิกที่ภาพเพื่อดูค่าสี</p>
    
    <button id="start-camera" py-click="start_video">เปิดกล้อง</button>

    <div id="video-container">
        <!-- วิดีโอสำหรับแสดงภาพสดจากกล้อง -->
        <video id="camera-feed" autoplay playsinline py-click="pick_color"></video>
        <!-- Canvas สำหรับดึงข้อมูลพิกเซล -->
        <canvas id="snapshot-canvas"></canvas>
    </div>

    <div class="result-box">
        <div id="color-preview"></div>
        <h3>ค่าสี (RGB): <span id="rgb-value">-</span></h3>
        <h3>โค้ดสี (HEX): <span id="hex-value">-</span></h3>
    </div>

    <script type="py" src="./main.py" config="./pyscript.toml"></script>
</body>
</html>
